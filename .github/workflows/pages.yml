name: Deploy landing page to GitHub Pages

on:
  # Auto-deploy when the landing page itself changes...
  push:
    branches: [release, main]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  # ...and also on every published Release (so the "latest release"
  # banner / version pill stays accurate). The page also fetches the
  # GitHub API client-side, so an old deploy would still pick up new
  # releases, but redeploying keeps the static markup fresh.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't queue multiple concurrent deploys; cancel any in-progress one.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload landing/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
