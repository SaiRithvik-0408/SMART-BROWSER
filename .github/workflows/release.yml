name: Build & Release SmartBrowser

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:        # also allow manual trigger from the Actions tab

permissions:
  contents: write           # needed to create the GitHub Release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # NOTE: Windows is `continue-on-error` because GitHub-hosted windows-2022
    # runners do not grant SeCreateSymbolicLinkPrivilege, and every
    # Windows electron-builder run unconditionally downloads + 7z-extracts
    # winCodeSign-2.6.0.7z which contains macOS dylibs stored as symlinks.
    # Extraction fails with "A required privilege is not held by the client"
    # and electron-builder retries 4x (~15-20 min). Until we either
    # cross-compile via wine on Linux or pre-extract the cache, let the
    # Mac + Linux artifacts ship without blocking on Windows.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: 'dist_electron/*.exe'
          - os: macos-latest
            artifact_glob: 'dist_electron/*.dmg'
          - os: ubuntu-latest
            artifact_glob: 'dist_electron/*.AppImage'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install the three workspaces explicitly. The root `npm install`
      # still runs its postinstall (now just `node scripts/fetch-tor.js`,
      # NOT recursive child installs - that dead-locks on Windows because
      # the outer npm holds locks on node_modules/.staging).
      - name: Install root deps (+ auto-fetches Tor for this platform)
        run: npm install --no-audit --no-fund

      - name: Install backend-node deps
        run: npm install --no-audit --no-fund --prefix backend-node

      - name: Install frontend deps
        run: npm install --no-audit --no-fund --prefix frontend

      - name: Build frontend
        run: npm run build:frontend

      - name: Package installer
        env:
          # No code-signing cert in CI. The package.json `win.signAndEditExecutable: false`
          # already disables Windows signing; this just stops electron-builder from
          # walking the keychain on macOS too.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartbrowser-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Run even if Windows job was marked continue-on-error and "failed".
    # As long as at least one platform produced an artifact we ship a Release.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SmartBrowser ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
          fail_on_unmatched_files: false
